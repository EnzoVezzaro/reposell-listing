name: deploy docs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Regenerate public index
        run: node scripts/build-listings-index.mjs
        env:
          LISTING_SIGNING_KEY: ${{ secrets.LISTING_SIGNING_KEY }}
          REQUIRE_SIGNING: '1'
      # SIG-01: an unsigned or unverifiable index must never reach Pages.
      - name: Verify signed index
        run: node scripts/require-signed-index.mjs
      - name: Build docs
        run: npm run docs:build
      - name: Add CNAME
        run: echo "listing.reposell.dev" > docs/.vitepress/dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4

name: verify-listing-pr

# Listing CI (spec §4, D13): verifies every Listing PR fail-closed.
# INVARIANT: this workflow only VERIFIES the seller's /sell and its Payment
# Link. It never creates, modifies, or proxies the seller's transaction.

on:
  pull_request:
    paths: ['listing/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Derive record from live /sell and verify fail-closed
        run: bun scripts/verify-pr.mjs
        env:
          # Read-only verification needs NO Stripe secret (§17). Discovery
          # link creation happens only AFTER merge, in discovery-sync.yml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Label PASS
        if: success()
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: verified

      - name: Fail closed on BLOCKED
        if: failure()
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: blocked

  automerge:
    name: Merge verified Listing PR (PASS → listed)
    needs: verify
    if: success() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the verified PR
        # On merge, discovery-sync.yml promotes the payload into a canonical
        # registry record, provisions the immutable discovery Payment Link,
        # and the listing goes live in the directory.
        run: gh pr merge --squash --delete-branch "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

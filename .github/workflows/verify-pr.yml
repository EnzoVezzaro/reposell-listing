name: verify-listing-pr

# Listing CI (spec §4, D13): verifies every Listing PR fail-closed.
# INVARIANT: this workflow only VERIFIES the seller's /sell and its Payment
# Link. It never creates, modifies, or proxies the seller's transaction.

on:
  pull_request:
    paths: ['listing/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Extract PR payload
        run: |
          PR_FILES=$(ls listing/*.pr.json 2>/dev/null || true)
          if [ -z "$PR_FILES" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "No Listing PR payload present (manual run) — nothing to verify."
              exit 0
            fi
            echo "::error::no listing/*.pr.json payload found in this Listing PR"
            exit 1
          fi
          {
            echo 'PR_FILES<<EOF'
            echo "$PR_FILES"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Run 12-step verification
        run: |
          set -e
          # Verify EVERY payload in the PR — a single verified file must not
          # smuggle additional unverified ones into the registry (fail-closed).
          while IFS= read -r PR_FILE; do
            [ -e "$PR_FILE" ] || continue
            echo "verifying $PR_FILE"
            bun scripts/verify-pr.mjs "$PR_FILE"
          done <<< "$PR_FILES"
        env:
          # Read-only verification needs NO Stripe secret (§17). Discovery
          # link creation happens only AFTER merge, in discovery-sync.yml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label PASS
        if: success()
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: verified

      - name: Fail closed on BLOCKED
        if: failure()
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: blocked

  automerge:
    name: Merge verified Listing PR (PASS → listed)
    needs: verify
    if: success() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the verified PR
        # On merge, discovery-sync.yml promotes the payload into a canonical
        # registry record, provisions the immutable discovery Payment Link,
        # and the listing goes live in the directory.
        run: gh pr merge --squash --delete-branch "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

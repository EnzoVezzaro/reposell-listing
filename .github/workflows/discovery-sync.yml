name: discovery-sync

# Runs AFTER merge (spec §6, D16): creates the Listing's OWN Stripe
# Product/Price/Payment Link for DISCOVERY access — idempotent, immutable
# per release. INVARIANT: this workflow never touches the seller's Stripe
# account, links, or transactions.

on:
  push:
    branches: [main]
    paths: ['listing/**']
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      # §17: the Listing Stripe secret exists ONLY here, as an Actions
      # secret. It is never committed, logged, or exposed to PRs.
      - name: Ensure immutable discovery links
        run: bun scripts/discovery-sync.mjs
        env:
          LISTING_STRIPE_SECRET_KEY: ${{ secrets.LISTING_STRIPE_SECRET_KEY }}

      - name: Regenerate public index
        run: node scripts/build-listings-index.mjs

      - name: Create Discussion for new listings
        run: node scripts/create-discussions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated registry updates
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "reposell-listing-ci"
            git config user.email "ci@reposell.dev"
            git add listing/ docs/public/registry/listings.json docs/registry/
            git commit -m "ci: sync discovery payment metadata + rebuild index"
            git push
          fi

name: stripe
type: stdio
command: npx
args:
  - -y
  - "@modelcontextprotocol/server-stripe"
env:
  STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY}"
tools:
  - stripe_create_checkout_session
  - stripe_list_products
  - stripe_list_prices
  - stripe_get_product
  - stripe_get_price
resources:
  - stripe://products/{product_id}
  - stripe://prices/{price_id}